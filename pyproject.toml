[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "gnss-oca"
version = "1.0.0"
description = "GNSS Orbit and Clock Analysis Software"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "Hüseyin DUMAN",       email = "hduman@cumhuriyet.edu.tr" },
    { name = "Salih Sermet Ogutcu" },
    { name = "Salih Alcay" },
]

keywords = [
    "GNSS",
    "orbit",
    "clock",
    "SP3",
    "CLK",
    "geodesy",
    "analysis"
]

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "requests",
    "tkcalendar"
]


[project.scripts]
gnss-oca = "goca.__main__:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["goca", "goca.*"]
exclude = ["__pycache__", "*.pyc"]


[tool.setuptools]
include-package-data = true